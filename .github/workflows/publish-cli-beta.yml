# Publishes a dexto 2.0 beta from cli-2.0 under npm's `next` tag, by hand only (DEXTO-2031).
#
# It never touches `latest`, and main's release path (changesets-publish.yml) is unchanged.
# dexto resolves its @dexto/* dependencies to exact versions when published, so the packages it
# needs publish as prereleases with it, also under `next`. scripts/cli-beta-packages.txt lists
# them in dependency order, including core/storage (better-sqlite3 ~12.9.0 for Node 24) and
# every public dependent of the bumped packages, so none pulls stable core/storage back in.
# All public workspace packages now join the beta; none retain a stale stable version.
name: Publish dexto beta (manual)

on:
    pull_request:
        branches: [cli-2.0]
    workflow_dispatch:
        inputs:
            beta:
                description: 'The beta number: 0 publishes dexto 2.0.0-beta.0'
                required: true

            publish:
                description: Publish under next (release-owner authorization required)
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: cli-beta-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'manual' }}
    cancel-in-progress: false

jobs:
    validate:
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/cli-2.0'
        strategy:
            matrix:
                node: [20, 22, 24]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: corepack enable
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: 'pnpm'
                  registry-url: 'https://registry.npmjs.org'
            - run: pnpm install --frozen-lockfile
            - run: node --test scripts/cli-beta-registry.test.mjs

            - name: Version the beta
              env:
                  BETA: ${{ inputs.beta || '5' }}
              run: |
                  set -euo pipefail
                  [[ "$BETA" =~ ^[0-9]+$ ]] || { echo "beta must be a whole number, such as 0" >&2; exit 1; }
                  node scripts/check-cli-beta-packages.mjs
                  while IFS=: read -r -u 3 dir version; do
                    VERSION="${version}-beta.${BETA}" node -e 'const fs = require("fs"); const path = process.argv[1] + "/package.json"; const pkg = JSON.parse(fs.readFileSync(path, "utf8")); pkg.version = process.env.VERSION; fs.writeFileSync(path, JSON.stringify(pkg, null, 4) + "\n");' "$dir"
                  done 3< scripts/cli-beta-packages.txt

            - run: pnpm run build

            - name: Pack and validate without publishing
              run: node scripts/pack-cli-beta.mjs /tmp/cli-beta-artifacts

            - uses: actions/upload-artifact@v4
              with:
                  name: cli-beta-node-${{ matrix.node }}
                  path: /tmp/cli-beta-artifacts

    publish:
        needs: validate
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/cli-2.0' && inputs.publish
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: corepack enable
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  registry-url: https://registry.npmjs.org
            - uses: actions/download-artifact@v4
              with:
                  name: cli-beta-node-20
                  path: /tmp/cli-beta-artifacts
            - run: sha256sum --check SHA256SUMS
              working-directory: /tmp/cli-beta-artifacts
            # The token is only in this step, never during validation.
            - name: Publish validated tarballs under next
              env:
                  BETA: ${{ inputs.beta }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  set -euo pipefail
                  while IFS=: read -r -u 3 dir version; do
                    name=$(node -p 'require("./" + process.argv[1] + "/package.json").name' "$dir")
                    v="${version}-beta.${BETA}"
                    NAME="$name" VERSION="$v" node --input-type=module -e 'import { isPublished } from "./scripts/cli-beta-registry.mjs"; if (await isPublished(process.env.NAME, process.env.VERSION)) throw new Error("Version already published");'
                    file="${name#@}"
                    pnpm publish "/tmp/cli-beta-artifacts/${file//\//-}-$v.tgz" --tag next --access public --no-git-checks
                  done 3< scripts/cli-beta-packages.txt
