# Publishes a dexto 2.0 beta from cli-2.0 under npm's `next` tag, by hand only (DEXTO-2031).
#
# It never touches `latest`, and main's release path (changesets-publish.yml) is unchanged.
# dexto resolves its @dexto/* dependencies to exact versions when published, so the packages it
# needs publish as prereleases with it, also under `next`. scripts/cli-beta-packages.txt lists
# them in dependency order, including core/storage (better-sqlite3 ~12.9.0 for Node 24) and
# every public dependent of the bumped packages, so none pulls stable core/storage back in.
# llm, registry and client-sdk have unchanged dependency manifests and retain npm's 1.14.4.
name: Publish dexto beta (manual)

on:
  workflow_dispatch:
    inputs:
      beta:
        description: 'The beta number: 0 publishes dexto 2.0.0-beta.0'
        required: true

permissions:
  contents: read

concurrency:
  group: publish-cli-beta
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/cli-2.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile

      - name: Version the beta
        env:
          BETA: ${{ inputs.beta }}
        run: |
          set -euo pipefail
          [[ "$BETA" =~ ^[0-9]+$ ]] || { echo "beta must be a whole number, such as 0" >&2; exit 1; }
          stable_tag='@dexto/llm@1.14.4'
          if ! git rev-parse --verify "refs/tags/$stable_tag" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$stable_tag:refs/tags/$stable_tag"
          fi
          git diff --quiet "$stable_tag" HEAD -- packages/llm packages/registry packages/client-sdk ':(exclude)**/CHANGELOG.md' || {
            echo 'Retained stable packages changed; include them in the beta release.' >&2
            exit 1
          }
          node scripts/check-cli-beta-packages.mjs
          while IFS=: read -r -u 3 dir version; do
            VERSION="${version}-beta.${BETA}" node -e 'const fs = require("fs"); const path = process.argv[1] + "/package.json"; const pkg = JSON.parse(fs.readFileSync(path, "utf8")); pkg.version = process.env.VERSION; fs.writeFileSync(path, JSON.stringify(pkg, null, 4) + "\n");' "$dir"
          done 3< scripts/cli-beta-packages.txt

      - run: pnpm run build

      # The token is only in this step, never during install or build.
      - name: Publish under next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          while IFS=: read -r -u 3 dir version; do
            read -r name v < <(node -e 'const pkg = require("./" + process.argv[1] + "/package.json"); console.log(pkg.name, pkg.version);' "$dir")
            npm view "$name@$v" version >/dev/null 2>&1 && { echo "skip $name@$v"; continue; }
            (cd "$dir" && pnpm publish --tag next --access public --no-git-checks)
          done 3< scripts/cli-beta-packages.txt
          pnpm view dexto dist-tags
