name: Docker Runtime Smoke

on:
    pull_request:
        branches: [main]
        paths:
            - Dockerfile
            - .dockerignore
            - .github/workflows/docker-runtime-smoke.yml
            - scripts/**
            - turbo.json
            - tsconfig*.json
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
            - packages/**
            - agents/**
    workflow_dispatch: {}

permissions:
    contents: read

concurrency:
    group: docker-runtime-smoke-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    smoke:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
            - name: Pull official Node image from ECR Public mirror
              run: |
                  node_version=$(sed -n 's/^ARG NODE_VERSION=//p' Dockerfile)
                  docker pull "public.ecr.aws/docker/library/node:${node_version}-alpine"
                  docker tag "public.ecr.aws/docker/library/node:${node_version}-alpine" "node:${node_version}-alpine"
            - name: Build production Docker image
              run: docker build -t dexto-runtime-smoke .
            - name: Test production runtime and persistence
              run: node scripts/test-docker-runtime.mjs dexto-runtime-smoke
