# Changesets - Release
#
# NPM Authentication: Using granular access token (NPM_TOKEN secret)
#
# OIDC Trusted Publishing - Deferred (Jan 14, 2026)
# We attempted OIDC-based npm publishing but reverted due to:
#   1. Requires manual first publish for any new packages
#   2. Requires setting up trusted publishers per-package (no org-level support)
#   3. Early adoption phase - slow and painful setup process
#   4. No human-in-the-loop/2FA for CI releases (security tradeoff)
# See attempted implementation: https://github.com/truffle-ai/dexto/commit/a2ff7237186ce21f0ff36edbf7b79794432cf572
# References:
#   - https://docs.npmjs.com/trusted-publishers
#   - https://github.blog/changelog/2025-12-09-npm-classic-tokens-revoked-session-based-auth-and-cli-token-management-now-available/
# Revisit when npm OIDC matures and supports org-level configuration.

name: Changesets - Release

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published_packages: ${{ steps.changesets.outputs.publishedPackages }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    concurrency:
      group: changesets-release
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
          always-auth: true
          scope: '@dexto'
      - run: pnpm install --frozen-lockfile
      # `changeset:publish` is `pnpm -w build && pnpm -w changeset publish`. The build runs here,
      # before the release step, so it never sees the npm token. It runs whenever changesets/action
      # will publish: when no changeset is pending, and always in pre mode, where the action's own
      # filtering is harder to mirror. With changesets pending, the action opens the version PR
      # instead and nothing is built, as before.
      - name: Build packages to publish
        run: |
          shopt -s nullglob
          pending=()
          for changeset in .changeset/*.md; do
            # Changesets ignores README.md in any case (`/^README\.md$/i` in @changesets/read).
            name="$(basename "${changeset}")"
            [[ "${name,,}" == readme.md ]] || pending+=("${changeset}")
          done
          if [[ -f .changeset/pre.json || ${#pending[@]} -eq 0 ]]; then
            pnpm -w build
          else
            echo "Changesets are pending; the release step opens the version PR and publishes nothing."
          fi
      # Only this step sees the npm token. changesets/action runs the publish command itself, and
      # npm reads the token through the .npmrc setup-node wrote (`_authToken=${NODE_AUTH_TOKEN}`).
      # Earlier steps see setup-node's placeholder, which public installs don't need.
      - name: Version / Publish with Changesets
        id: changesets
        uses: changesets/action@v1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          title: 'chore: version packages'
          commit: 'chore: version packages'
          version: pnpm run changeset:version
          publish: pnpm -w changeset publish
      # `next` is the newest of `latest` and the newest beta, so it must never sit below `latest`
      # (DEXTO-2518). A stable `dexto` publish moves `latest` only, so move `next` up to it when
      # `next` is missing or older. A prerelease publish (pre mode) leaves `latest` alone and is
      # skipped; publish-cli-beta.yml moves `next` for betas. continue-on-error keeps a failed tag
      # move from blocking the standalone binaries, which need this job to succeed.
      - name: Move next up to latest if it fell behind
        if: steps.changesets.outputs.published == 'true'
        continue-on-error: true
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(jq -r 'map(select(.name == "dexto")) | .[0].version // empty' <<< "${PUBLISHED_PACKAGES}")"
          if [[ -z "${version}" ]]; then
            echo "dexto was not published; next stays where it is."
            exit 0
          fi
          if [[ "${version}" == *-* ]]; then
            echo "dexto@${version} is a prerelease, so latest did not move; next stays where it is."
            exit 0
          fi

          # Read anonymously, as npm-dist-tag.yml does. The registry can serve the tags from
          # before the publish for a short while, so wait for latest to show this version.
          view_tag() { NPM_CONFIG_USERCONFIG=/dev/null npm view dexto "dist-tags.$1"; }
          latest=""
          for attempt in {1..12}; do
            latest="$(view_tag latest)"
            [[ "${latest}" == "${version}" ]] && break
            echo "latest is '${latest}', waiting for ${version} (attempt ${attempt}/12)..."
            sleep 10
          done
          if [[ "${latest}" != "${version}" ]]; then
            echo "::warning::latest is '${latest}', not the published ${version}; leaving next alone."
            exit 0
          fi
          next="$(view_tag next)"

          # Semver precedence with prereleases, so 2.3.0-beta.1 > 2.2.3 > 2.2.3-beta.9.
          # Prints "behind" when next is missing or lower than latest.
          behind="$(LATEST="${latest}" NEXT="${next}" node -e '
            const parse = (v) => {
              const [core, pre] = v.split("+")[0].split(/-(.*)/s);
              return { core: core.split(".").map(Number), pre: pre ? pre.split(".") : [] };
            };
            const comparePart = (a, b) => {
              const [an, bn] = [/^\d+$/.test(a), /^\d+$/.test(b)];
              if (an && bn) return Number(a) - Number(b);
              if (an !== bn) return an ? -1 : 1;
              return a < b ? -1 : a > b ? 1 : 0;
            };
            const compare = (x, y) => {
              const [a, b] = [parse(x), parse(y)];
              const core = a.core.map((n, i) => n - b.core[i]).find((d) => d !== 0) ?? 0;
              if (core !== 0) return core;
              if (!a.pre.length || !b.pre.length) return b.pre.length - a.pre.length;
              for (let i = 0; i < Math.min(a.pre.length, b.pre.length); i++) {
                const d = comparePart(a.pre[i], b.pre[i]);
                if (d !== 0) return d;
              }
              return a.pre.length - b.pre.length;
            };
            const { LATEST, NEXT } = process.env;
            console.log(!NEXT || compare(NEXT, LATEST) < 0 ? "behind" : "ok");
          ')"

          if [[ "${behind}" != behind ]]; then
            echo "next is ${next}, not below latest ${latest}; next stays where it is."
            exit 0
          fi
          echo "next is '${next:-missing}', below latest ${latest}; moving next to ${latest}."
          npm dist-tag add "dexto@${latest}" next
          echo "dist-tags after the move:"
          NPM_CONFIG_USERCONFIG=/dev/null npm dist-tag ls dexto

  derive-dexto-release-tag:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Derive dexto release tag from published packages
        id: tag
        env:
          PUBLISHED_PACKAGES: ${{ needs.release.outputs.published_packages }}
        run: |
          set -euo pipefail

          if ! VERSION="$(jq -r 'map(select(.name == "dexto")) | .[0].version // empty' <<< "${PUBLISHED_PACKAGES}")"; then
            echo "Failed to parse publishedPackages JSON; aborting." >&2
            exit 1
          fi

          if [[ -z "${VERSION}" || "${VERSION}" == "null" ]]; then
            echo "No dexto package found in publishedPackages; skipping standalone binaries."
            echo "release_tag=" >> "${GITHUB_OUTPUT}"
            echo "version=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "release_tag=dexto@${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  build-standalone-binaries:
    needs: derive-dexto-release-tag
    if: needs.derive-dexto-release-tag.outputs.release_tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ needs.derive-dexto-release-tag.outputs.release_tag }}
      VERSION: ${{ needs.derive-dexto-release-tag.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages and embed WebUI
        run: pnpm run build:all

      - name: Build standalone binary
        run: |
          scripts/build-standalone-binaries.sh \
            --version "${VERSION}" \
            --output-dir "${RUNNER_TEMP}/dexto-binaries" \
            --skip-checksums

      - name: Smoke test standalone binary
        run: |
          scripts/test-standalone-binaries.sh \
            --input-dir "${RUNNER_TEMP}/dexto-binaries" \
            --version "${VERSION}" \
            --skip-checksums

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/dexto-binaries/dexto-${{ env.VERSION }}-${{ matrix.target }}.tar.gz
            ${{ runner.temp }}/dexto-binaries/dexto-${{ env.VERSION }}-${{ matrix.target }}.zip
          if-no-files-found: error

  upload-standalone-binaries:
    needs:
      - derive-dexto-release-tag
      - build-standalone-binaries
    if: needs.derive-dexto-release-tag.outputs.release_tag != ''
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.derive-dexto-release-tag.outputs.release_tag }}
      VERSION: ${{ needs.derive-dexto-release-tag.outputs.version }}
    steps:
      - name: Download standalone artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          path: ${{ runner.temp }}/dexto-binaries
          merge-multiple: true

      - name: Create checksums file
        run: |
          cd "${RUNNER_TEMP}/dexto-binaries"
          {
            shopt -s nullglob
            assets=(dexto-"${VERSION}"-*.tar.gz dexto-"${VERSION}"-*.zip)
            for asset in "${assets[@]}"; do
              if command -v sha256sum >/dev/null 2>&1; then
                hash="$(sha256sum "${asset}" | awk '{print $1}')"
              else
                hash="$(shasum -a 256 "${asset}" | awk '{print $1}')"
              fi
              echo "${hash}  ${asset}"
            done
          } | sort > "dexto-${VERSION}-checksums.txt"

      - name: Wait for release to be available
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in {1..30}; do
            if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "Release ${RELEASE_TAG} is available."
              exit 0
            fi
            echo "Waiting for release ${RELEASE_TAG} (attempt ${attempt}/30)..."
            sleep 10
          done

          echo "Release ${RELEASE_TAG} was not available in time." >&2
          exit 1

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${RELEASE_TAG}" "${RUNNER_TEMP}/dexto-binaries"/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
